{% extends "templates/web.html" %}

{% block title %}{{ title }}{% endblock %}

{% block page_content %}
<div class="container" style="max-width: 440px; margin: 48px auto;">
	<h3 class="mb-2">Connexion personnel</h3>
	<p class="text-muted mb-4">
		Accès réservé au personnel et aux coordinateurs (email + mot de passe).
	</p>

	{% if error %}
	<div class="alert alert-danger" role="alert">{{ error }}</div>
	{% endif %}

	<form method="post" action="/connexion-coordinateur">
		<div class="form-group">
			<label for="email">Email</label>
			<input type="email" id="email" name="email" class="form-control"
				value="{{ email or '' }}" required autofocus>
		</div>
		<div class="form-group">
			<label for="mot_de_passe">Mot de passe</label>
			<input type="password" id="mot_de_passe" name="mot_de_passe" class="form-control" required>
		</div>
		<button type="submit" class="btn btn-primary btn-block">Se connecter</button>
	</form>

	<p class="mt-3 mb-0">
		<a href="/connexion-etudiant">&larr; Connexion étudiant (matricule)</a>
	</p>
</div>
{% endblock %}
