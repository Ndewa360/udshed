<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; background: #f8f9fa; border-radius: 12px; overflow: hidden; border: 1px solid #e2e4e9;">

  <!-- Header -->
  <div style="background: #1e2025; padding: 32px; text-align: center;">
    <h1 style="color: #ffffff; font-size: 20px; margin: 0; letter-spacing: -0.02em;">UDSHED</h1>
    <p style="color: #9ca0a8; font-size: 13px; margin: 6px 0 0 0;">Université Dshang</p>

  <!-- Body -->
  <div style="padding: 32px; background: #ffffff;">
    <p style="color: #3c3e44; font-size: 15px; line-height: 1.6;">

    <hr style="border: 0; border-top: 1px solid #e2e4e9; margin: 24px 0;">

    </p>

    </p>

      L'équipe UDSHED
    </p>
  </div>

  <!-- Footer -->
  <div style="padding: 20px 32px; background: #f5f6f8; border-top: 1px solid #e2e4e9; text-align: center;">
    <p style="color: #9ca0a8; font-size: 12px; margin: 0;">
      UDSHED — Plateforme de gestion des inscriptions académiques
    </p>
  </div>

</div>
